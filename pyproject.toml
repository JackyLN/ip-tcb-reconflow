[project]
name = "reconflow"
version = "0.1.0"
description = "Synthetic merchant settlement operations"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.20,<1",
    "pydantic-settings>=2.7,<3",
    "argon2-cffi>=23,<26",
    "itsdangerous>=2.2,<3",
    "httpx>=0.28,<1",
    "markdown-it-py>=4,<5",
    "mdit-py-plugins>=0.5,<1",
    "pygments>=2.19,<3",
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
