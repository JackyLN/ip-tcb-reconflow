# Shared VPS: the existing Stayflow Caddy owns ports 80/443 and certificates.
name: reconflow
x-runtime: &runtime
  image: reconflow-app:${RECONFLOW_IMAGE_TAG:-current}
  build: .
  env_file: .env.production
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  init: true
  stop_grace_period: 60s
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  mem_limit: 512m
  cpus: 1.0
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?production database user required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?production database password required}
      POSTGRES_DB: ${POSTGRES_DB:-reconflow}
    volumes: ["db_data:/var/lib/postgresql/data"]
    networks: [backend]
    restart: unless-stopped
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  app:
    <<: *runtime
    networks:
      backend:
      edge:
        aliases: [reconflow-app]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
  worker:
    <<: *runtime
    command: ["python", "-m", "reconflow.worker"]
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "from reconflow.db import SessionLocal,now; from reconflow.models import Control; s=SessionLocal(); c=s.get(Control,1); assert c and c.worker_heartbeat and (now()-c.worker_heartbeat).total_seconds()<30"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
networks:
  backend:
  edge:
    external: true
    name: stayflow_backend
volumes:
  db_data:
