name: verify
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3 (Node.js 24)
        with:
          version: '0.11.8'
      - run: uv sync --python 3.12 --frozen
      - run: make lint test
      - run: uv run python -m scripts.check_public_docs
      - run: node --check reconflow/static/app.js
      - run: make configure
      - run: docker compose up -d db
      - run: docker compose build
      - run: make migrate
      - run: mkdir -p artifacts && (umask 077; make seed > artifacts/demo-credentials.txt)
      - run: docker compose up -d --wait
      - run: make smoke eval
      - run: docker compose exec -T app python -m scripts.postgres_checks
      - if: always()
        run: docker compose down
