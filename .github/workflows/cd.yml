name: CD

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reconflow-production
  cancel-in-progress: false

jobs:
  verify:
    if: github.actor == 'JackyLN'
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Record verified revision
        id: source
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.8'
      - run: uv sync --python 3.12 --frozen
      - run: make lint test
      - run: node --check reconflow/static/app.js

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://tcb.jackylenghia.com
    steps:
      - name: Check out verified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.revision }}
      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_SSH_PRIVATE_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Synchronize ReconFlow source
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          ssh -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" 'install -d -m 750 /opt/reconflow'
          rsync -az --delete \
            -e "ssh -i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            --exclude='.git/' --exclude='.env' --exclude='.env.*' \
            --exclude='.venv/' --exclude='node_modules/' --exclude='artifacts/' \
            --exclude='__pycache__/' --exclude='.pytest_cache/' --exclude='.ruff_cache/' \
            --exclude='backups/' --exclude='.secrets/' --exclude='.deployed-sha' \
            ./ "$VPS_USER@$VPS_HOST:/opt/reconflow/"
      - name: Build, back up, migrate and deploy ReconFlow
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          DEPLOYED_SHA=$(git rev-parse HEAD)
          ssh -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "cd /opt/reconflow && bash scripts/deploy.sh $DEPLOYED_SHA"
      - name: Verify public HTTPS
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors \
            --max-time 15 https://tcb.jackylenghia.com/readyz
          HTTP_STATUS=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --max-time 15 https://tcb.jackylenghia.com/login)
          test "$HTTP_STATUS" = '200'
      - name: Remove runner SSH material
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
