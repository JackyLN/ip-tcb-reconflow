x-python: &python
  build: .
  env_file: .env
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
  mem_limit: 512m
  cpus: 1.0
  security_opt: ["no-new-privileges:true"]
  read_only: true
  tmpfs: [/tmp]
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?run make configure}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make configure}
      POSTGRES_DB: ${POSTGRES_DB:-reconflow}
    volumes: ["db_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 768m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  app:
    <<: *python
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 12
  worker:
    <<: *python
    command: ["python", "-m", "reconflow.worker"]
    healthcheck:
      test: ["CMD", "python", "-c", "from reconflow.db import SessionLocal,now; from reconflow.models import Control; s=SessionLocal(); c=s.get(Control,1); assert c and c.worker_heartbeat and (now()-c.worker_heartbeat).total_seconds()<30"]
      interval: 10s
      timeout: 5s
      retries: 12
  caddy:
    image: caddy:2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports: ["${HTTP_PORT:-8080}:80", "${HTTPS_PORT:-8443}:443"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    mem_limit: 128m
volumes:
  db_data:
  caddy_data:
  caddy_config:
